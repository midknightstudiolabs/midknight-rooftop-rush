# Based on https://github.com/actions/starter-workflows/blob/main/pages/static.yml
name: Test and publish Midknight Rush
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: midknight-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test gameplay and motion
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare public game files
        run: |
          mkdir _site
          cp *.js *.css index.html THREE-LICENSE.txt _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v5
